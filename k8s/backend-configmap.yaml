apiVersion: v1
kind: ConfigMap
metadata:
  name: item-kafka-backend-config
  namespace: item-kafka-poc-express
data:
  PORT: "8082"
  NODE_ENV: "production"
  ITEM_SOURCE_DB_TYPE: "mysql"
  ITEM_MYSQL_SOURCE_HOST: "your-rds-endpoint"
  ITEM_MYSQL_SOURCE_DB: "item_poc_source"
  ITEM_MYSQL_HOST: "your-rds-endpoint"
  ITEM_MYSQL_DB: "item_poc"
  ITEM_KAFKA_BOOTSTRAP_SERVERS: "your-msk-bootstrap:9092"
  ITEM_KAFKA_TOPIC: "Item_Topic"
  ITEM_CORS_ALLOWED_ORIGINS: "https://your-ui-domain"
  ITEM_GATEWAY_URL: "http://localhost:8081/item-kafka/app/send-items/v1"

