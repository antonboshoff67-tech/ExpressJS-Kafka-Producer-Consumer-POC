# Full local stack: MySQL (source + sink) + Kafka (KRaft) + the Express.js
# backend itself, all wired together with the same defaults as .env.example.
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: item-poc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-me
      MYSQL_DATABASE: item_poc
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql-scripts/02_mysql_item_source_seed_200.sql:/docker-entrypoint-initdb.d/01_source_seed.sql
      - ./sql-scripts/03_mysql_item_sink_and_consumed_tables.sql:/docker-entrypoint-initdb.d/02_sink_tables.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-me"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: item-poc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data

  backend:
    build: .
    container_name: item-poc-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      ITEM_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ITEM_SOURCE_DB_TYPE: mysql
      ITEM_MYSQL_SOURCE_HOST: mysql
      ITEM_MYSQL_SOURCE_DB: item_poc_source
      ITEM_MYSQL_SOURCE_USERNAME: root
      ITEM_MYSQL_SOURCE_PASSWORD: change-me
      ITEM_MYSQL_HOST: mysql
      ITEM_MYSQL_DB: item_poc
      ITEM_MYSQL_USERNAME: root
      ITEM_MYSQL_PASSWORD: change-me
      ITEM_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

volumes:
  mysql-data:
  kafka-data:

